<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0D1B3E;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      color: #0D1B3E;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .emoji { font-size: 56px; }
    h1 { margin: 12px 0 8px; font-size: 28px; }
    p { color: #444; line-height: 1.5; margin-bottom: 24px; }
    a {
      display: block;
      background: #C8A84B;
      color: #0D1B3E;
      text-decoration: none;
      font-weight: 600;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    a:hover { opacity: 0.9; }
    footer { margin-top: 20px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚀</div>
    <h1>Ellie</h1>
    <p>From every corner of the world to your table.</p>
    <a href="https://www.linkedin.com/in/elefterie-kapsalis/" target="_blank">LinkedIn</a>
    <a href="mailto:kapsaliselefterie@gmail.com">Email me</a>
    <footer>Built with AI in Build with AI · Startup UCLA</footer>
  </div>
</body>
</html>
